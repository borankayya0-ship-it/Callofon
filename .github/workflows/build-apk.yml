def hesapla():
    print("--- Python Hesap Makinesi ---")
    print("1. Toplama (+)")
    print("2. Çıkarma (-)")
    print("3. Çarpma (*)")
    print("4. Bölme (/)")

    secim = input("İşlem seçin (1/2/3/4): ")

    if secim in ('1', '2', '3', '4'):
        try:
            sayi1 = float(input("Birinci sayı: "))
            sayi2 = float(input("İkinci sayı: "))
        except ValueError:
            print("Hata: Lütfen geçerli bir sayı girin!")
            return

        if secim == '1':
            print(f"Sonuç: {sayi1} + {sayi2} = {sayi1 + sayi2}")
        elif secim == '2':
            print(f"Sonuç: {sayi1} - {sayi2} = {sayi1 - sayi2}")
        elif secim == '3':
            print(f"Sonuç: {sayi1} * {sayi2} = {sayi1 * sayi2}")
        elif secim == '4':
            if sayi2 == 0:
                print("Hata: Bir sayı sıfıra bölünemez!")
            else:
                print(f"Sonuç: {sayi1} / {sayi2} = {sayi1 / sayi2}")
    else:
        print("Geçersiz seçim!")

if __name__ == "__main__":
    hesapla()
    
