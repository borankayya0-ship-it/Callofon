name: Hesap Makinesi Derle ve Test Et

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

      # Python Ortamını Kur
    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

      # Gerekli kütüphaneleri yükle
    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

      # Hesap makinesi kodunu derle (Tek dosya .exe veya çalıştırılabilir binary)
    - name: PyInstaller ile Derle
      run: |
        pyinstaller --onefile hesap_makinesi.py

      # Derlenen çıktıyı GitHub Artifacts olarak kaydet
    - name: Çıktıları Kaydet (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: hesap-makinesi-cikti
        path: dist/
        
