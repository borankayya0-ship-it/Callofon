name: Android APK Derle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Sistem Bağımlılıklarını Yükle
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Buildozer ve Cython Kurulumu
      run: |
        python3 -m pip install --upgrade pip
        pip install --upgrade cython==0.29.36 buildozer

    - name: Buildozer Yapılandırma Dosyası (buildozer.spec) Oluştur
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = Sesli Sohbet
        package.name = seslisohbet
        package.domain = org.sesli
        source.include_exts = py,png,jpg,kv,atlas
        source.dir = .
        version = 1.0
        requirements = python3,kivy
        orientation = portrait
        osx.python_version = 3
        osx.kivy_version = 1.9.1
        fullscreen = 0
        android.permissions = INTERNET, RECORD_AUDIO, MODIFY_AUDIO_SETTINGS, ACCESS_WIFI_STATE, ACCESS_NETWORK_STATE
        android.api = 33
        android.minapi = 21
        android.sdk = 30
        android.ndk = 25b
        android.accept_sdk_license = caffeinate
        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    - name: Python Sesli Sohbet Kodunu Oluştur (main.py)
      run: |
        cat << 'EOF' > main.py
        from kivy.app import App
        from kivy.uix.boxlayout import BoxLayout
        from kivy.uix.button import Button
        from kivy.uix.label import Label
        from kivy.uix.textinput import TextInput
        import socket

        class SesliSohbetApp(App):
            def build(self):
                layout = BoxLayout(orientation='vertical', padding=30, spacing=20)
                
                # Yerel IP adresini bul
                try:
                    s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                    s.connect(("8.8.8.8", 80))
                    ip = s.getsockname()[0]
                    s.close()
                except:
                    ip = "Bilinmiyor"

                layout.add_widget(Label(text="Wi-Fi Sesli Sohbet", font_size=26, size_hint_y=None, height=50))
                layout.add_widget(Label(text=f"Telefon IP Adresiniz:\n{ip}", font_size=18, size_hint_y=None, height=80))
                
                self.durum_label = Label(text="Durum: Bekleniyor...", font_size=16, size_hint_y=None, height=40)
                layout.add_widget(self.durum_label)

                self.ip_input = TextInput(text='', hint_text='Arkadaşın IP Adresi (Örn: 192.168.1.15)', multiline=False, size_hint_y=None, height=50)
                layout.add_widget(self.ip_input)

                self.baglan_btn = Button(text='Bağlan ve Konuş', size_hint_y=None, height=60, background_color=(0.1, 0.6, 0.2, 1))
                self.baglan_btn.bind(on_press=self.baglan)
                layout.add_widget(self.baglan_btn)

                return layout

            def baglan(self, instance):
                hedef = self.ip_input.text
                if hedef:
                    self.durum_label.text = f"Bağlanmaya çalışılıyor: {hedef}"
                else:
                    self.durum_label.text = "Lütfen geçerli bir IP girin!"

        if __name__ == '__main__':
            SesliSohbetApp().run()
        EOF

    - name: APK Derle (Buildozer Android)
        # Android SDK indirme ve derleme işlemi biraz zaman alabilir (yaklaşık 10-15 dk sürer)
      run: |
        buildozer -v android debug

    - name: APK Dosyasını Kaydet (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: sesli-sohbet-apk
        path: bin/*.apk
        
