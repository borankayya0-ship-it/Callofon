name: Sesli Konusma Uygulamasi Derle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller flask flask-socketio eventlet

    - name: Uygulama Kodunu Otomatik Oluştur
      run: |
        mkdir -p templates
        
        # --- Python Sunucu Kodu (app.py) ---
        cat << 'EOF' > app.py
        from flask import Flask, render_template
        from flask_socketio import SocketIO, emit
        import socket

        app = Flask(__name__)
        socketio = SocketIOapp = SocketIO(app, cors_allowed_origins="*")

        @app.route('/')
        def index():
            return render_template('index.html')

        @socketio.on('offer')
        def handle_offer(data):
            emit('offer', data, broadcast=True, include_self=False)

        @socketio.on('answer')
        def handle_answer(data):
            emit('answer', data, broadcast=True, include_self=False)

        @socketio.on('candidate')
        def handle_candidate(data):
            emit('candidate', data, broadcast=True, include_self=False)

        if __name__ == '__main__':
            hostname = socket.gethostname()
            local_ip = socket.gethostbyname(hostname)
            print(f"[*] Uygulama Başlatıldı! Wi-Fi IP Adresiniz: http://{local_ip}:5000")
            socketio.run(app, host='0.0.0.0', port=5000)
        EOF

        # --- Arayüz Kodu (templates/index.html) ---
        cat << 'EOF' > templates/index.html
        <!DOCTYPE html>
        <html lang="tr">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Wi-Fi Sesli Konuşma</title>
            <style>
                body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; padding-top: 50px; }
                button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; }
                #baglanBtn { background: #4CAF50; color: white; }
                #kapatBtn { background: #f44336; color: white; }
                input { padding: 12px; font-size: 16px; width: 250px; border-radius: 5px; border: 1px solid #ccc; text-align: center; }
                .box { background: #1e1e1e; padding: 25px; border-radius: 12px; display: inline-block; box-shadow: 0px 4px 15px rgba(0,0,0,0.5); }
            </style>
        </head>
        <body>
            <div class="box">
                <h2>Wi-Fi Sesli Sohbet</h2>
                <p id="durum">Durum: Bekleniyor...</p>
                <br>
                <input type="text" id="hedefIP" placeholder="Arkadaşın IP Adresi (Örn: 192.168.1.15)">
                <br><br>
                <button id="baglanBtn" onclick="aramayiBaslat()">Konuşmaya Başla</button>
                <button id="kapatBtn" onclick="aramayiKapat()" style="display:none;">Aramayı Bitir</button>
            </div>

            <audio id="remoteAudio" autoplay></audio>

            <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.1/socket.io.min.js"></script>
            <script>
                const socket = io();
                let localStream;
                let peerConnection;
                const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

                navigator.mediaDevices.getUserMedia({ audio: true, video: false }).then(stream => {
                    localStream = stream;
                }).catch(err => alert("Mikrofon izni reddedildi: " + err));

                async function aramayiBaslat() {
                    document.getElementById('durum').innerText = "Bağlanıyor...";
                    document.getElementById('baglanBtn').style.display = 'none';
                    document.getElementById('kapatBtn').style.display = 'inline-block';

                    peerConnection = new RTCPeerConnection(servers);
                    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                    peerConnection.ontrack = event => {
                        document.getElementById('remoteAudio').srcObject = event.streams[0];
                    };

                    peerConnection.onicecandidate = event => {
                        if (event.candidate) {
                            socket.emit('candidate', event.candidate);
                        }
                    };

                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    socket.emit('offer', offer);
                    document.getElementById('durum').innerText = "Ses iletiliyor, konuşabilirsiniz!";
                }

                socket.on('offer', async (offer) => {
                    if (!peerConnection) {
                        peerConnection = new RTCPeerConnection(servers);
                        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                        peerConnection.ontrack = event => {
                            document.getElementById('remoteAudio').srcObject = event.streams[0];
                        };

                        peerConnection.onicecandidate = event => {
                            if (event.candidate) {
                                socket.emit('candidate', event.candidate);
                            }
                        };
                    }

                    await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.emit('answer', answer);
                    document.getElementById('durum').innerText = "Bağlantı kuruldu!";
                    document.getElementById('baglanBtn').style.display = 'none';
                    document.getElementById('kapatBtn').style.display = 'inline-block';
                });

                socket.on('answer', async (answer) => {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                });

                socket.on('candidate', async (candidate) => {
                    if (peerConnection) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                    }
                });

                function aramayiKapat() {
                    if (peerConnection) peerConnection.close();
                    window.location.reload();
                }
            </script>
        </body>
        </html>
        EOF

    - name: PyInstaller ile Tek Dosya Haline Getir
      run: |
        pyinstaller --onefile --add-data "templates:templates" app.py

    - name: Çıktıları Kaydet (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: sesli-sohbet-uygulamasi
        path: dist/
        
