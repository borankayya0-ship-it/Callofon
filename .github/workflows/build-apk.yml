name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Create Full Android Project
        run: |
          set -e
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          cat > settings.gradle <<'EOF'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          mkdir -p app/src/main/java/com/fakecall/voip
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'

          android {
              namespace 'com.fakecall.voip'
              compileSdk 34
              defaultConfig {
                  applicationId "com.fakecall.voip"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
                  debug { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat > app/proguard-rules.pro <<'EOF'
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">FakeCall VoIP</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@android:mipmap/sym_def_app_icon"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/fakecall/voip/MainActivity.kt <<'EOF'
          package com.fakecall.voip

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.webkit.PermissionRequest
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private val PERM_REQ = 1001

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  setContentView(webView)

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO), PERM_REQ)
                  }

                  webView.settings.javaScriptEnabled = true
                  webView.settings.mediaPlaybackRequiresUserGesture = false
                  webView.settings.domStorageEnabled = true
                  webView.settings.allowFileAccess = true
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onPermissionRequest(request: PermissionRequest) {
                          runOnUiThread { request.grant(request.resources) }
                      }
                  }
                  webView.loadUrl("file:///android_asset/index.html")
              }
              override fun onBackPressed() {
                  if (webView.canGoBack()) webView.goBack() else super.onBackPressed()
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="tr">
          <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>FakeCall VoIP</title>
          <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
          <style>
              *{box-sizing:border-box;font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;}
              body{margin:0;background:#0f1115;color:#fff;display:flex;flex-direction:column;min-height:100vh;}
              .header{padding:20px;text-align:center;background:linear-gradient(135deg,#6a5af9,#8d4ef8);}
              .header h1{margin:0;font-size:24px;letter-spacing:0.5px}
              .header p{opacity:0.9;margin:6px 0 0;font-size:13px}
              .container{padding:16px;flex:1;display:flex;flex-direction:column;gap:14px;max-width:480px;width:100%;margin:0 auto;}
              .card{background:#1a1d26;border:1px solid #2a2e3a;border-radius:16px;padding:16px;}
              .label{font-size:12px;color:#9aa0b2;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:block;}
              input{width:100%;background:#0f1115;border:1px solid #2a2e3a;color:#fff;padding:14px;border-radius:12px;font-size:16px;outline:none;}
              input:focus{border-color:#6a5af9}
              .btn{width:100%;padding:14px;border-radius:12px;border:0;font-weight:700;font-size:15px;cursor:pointer;transition:0.2s}
              .btn-primary{background:linear-gradient(135deg,#6a5af9,#8d4ef8);color:#fff;}
              .btn-success{background:#1fdf75;color:#000;}
              .btn-danger{background:#ff3b5c;color:#fff;}
              .btn:disabled{opacity:0.4}
              .status{font-size:13px;padding:10px 12px;border-radius:10px;background:#0f1115;border:1px dashed #2a2e3a;color:#9aa0b2;}
              .status.online{color:#1fdf75;border-color:#1fdf75;background:rgba(31,223,117,0.08)}
              .row{display:flex;gap:10px}
              .row .btn{flex:1}
              audio{display:none}
              .pill{display:inline-block;padding:4px 8px;border-radius:20px;font-size:11px;background:#2a2e3a;color:#9aa0b2;margin-top:6px}
          </style>
          </head>
          <body>
          <div class="header">
              <h1>FakeCall VoIP</h1>
              <p>İnternet üzerinden sahte numara ile gerçek sesli arama</p>
          </div>
          <div class="container">
              <div class="card">
                  <span class="label">Senin Sahte Numaran</span>
                  <input id="myNumber" placeholder="örn: 05550001122" inputmode="numeric" />
                  <div style="height:10px"></div>
                  <button id="connectBtn" class="btn btn-primary">Bağlan ve Hazır Ol</button>
                  <div id="myStatus" class="status" style="margin-top:12px">Bağlı değil - numaranı yaz ve bağlan</div>
              </div>

              <div class="card">
                  <span class="label">Arkadaşının Sahte Numarası</span>
                  <input id="friendNumber" placeholder="örn: 05550003344" inputmode="numeric" />
                  <div style="height:12px"></div>
                  <div class="row">
                      <button id="callBtn" class="btn btn-success" disabled>Ara</button>
                      <button id="hangBtn" class="btn btn-danger" disabled>Kapat</button>
                  </div>
                  <div id="callStatus" class="status" style="margin-top:12px">Arama yok</div>
                  <span class="pill" id="micInfo">Mikrofon kapalı</span>
              </div>
              <audio id="remoteAudio" autoplay playsinline></audio>
          </div>

          <script>
          let peer = null;
          let currentCall = null;
          let localStream = null;

          const myNumberEl = document.getElementById('myNumber');
          const friendNumberEl = document.getElementById('friendNumber');
          const connectBtn = document.getElementById('connectBtn');
          const callBtn = document.getElementById('callBtn');
          const hangBtn = document.getElementById('hangBtn');
          const myStatusEl = document.getElementById('myStatus');
          const callStatusEl = document.getElementById('callStatus');
          const remoteAudio = document.getElementById('remoteAudio');
          const micInfo = document.getElementById('micInfo');

          async function getMic(){
              if(localStream) return localStream;
              try{
                  localStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}, video:false});
                  micInfo.textContent = 'Mikrofon aktif';
                  micInfo.style.background = '#1fdf75';
                  micInfo.style.color = '#000';
                  return localStream;
              }catch(e){
                  alert('Mikrofon izni gerekli: ' + e.message);
                  throw e;
              }
          }

          connectBtn.onclick = async () => {
              const id = myNumberEl.value.trim().replace(/[^0-9]/g,'');
              if(id.length < 7){ alert('En az 7 haneli sahte numara gir'); return; }
              connectBtn.disabled = true;
              myStatusEl.textContent = 'Mikrofon açılıyor...';
              try{ await getMic(); }catch{ connectBtn.disabled=false; return; }

              myStatusEl.textContent = 'Sunucuya bağlanıyor... ID: ' + id;
              peer = new Peer(id, {
                  config: { iceServers: [{urls:'stun:stun.l.google.com:19302'}, {urls:'stun:stun1.l.google.com:19302'}] }
              });

              peer.on('open', (openId)=>{
                  myStatusEl.textContent = '✅ Bağlısın! Numaran: ' + openId + ' - Arkadaşın bu numarayı arayabilir';
                  myStatusEl.className = 'status online';
                  callBtn.disabled = false;
                  connectBtn.textContent = 'Bağlı';
              });

              peer.on('call', async (call)=>{
                  const accept = confirm(call.peer + ' seni arıyor. Açsın mı?');
                  if(!accept){ call.close(); return; }
                  try{ await getMic(); }catch{ return; }
                  handleCall(call);
                  call.answer(localStream);
                  callStatusEl.textContent = call.peer + ' ile konuşuyorsun...';
              });

              peer.on('error', (err)=>{
                  myStatusEl.textContent = 'Hata: ' + err.type + ' - ' + err.message;
                  myStatusEl.className = 'status';
                  if(err.type === 'unavailable-id'){
                      alert('Bu numara başkası tarafından kullanılıyor, başka numara dene');
                      connectBtn.disabled = false;
                      connectBtn.textContent = 'Bağlan ve Hazır Ol';
                  }
              });

              peer.on('disconnected', ()=>{
                  myStatusEl.textContent = 'Bağlantı koptu, yeniden bağlanıyor...';
                  peer.reconnect();
              });
          };

          function handleCall(call){
              if(currentCall) currentCall.close();
              currentCall = call;
              callBtn.disabled = true;
              hangBtn.disabled = false;

              call.on('stream', (remoteStream)=>{
                  remoteAudio.srcObject = remoteStream;
                  remoteAudio.play().catch(()=>{});
                  callStatusEl.textContent = '🔊 Bağlandı - Ses geliyor';
              });
              call.on('close', ()=>{
                  endCallUI('Arama bitti');
              });
              call.on('error', (e)=>{
                  endCallUI('Hata: ' + e.message);
              });
          }

          callBtn.onclick = async () => {
              const fid = friendNumberEl.value.trim().replace(/[^0-9]/g,'');
              if(!fid){ alert('Arkadaşının numarasını gir'); return; }
              if(fid === myNumberEl.value.trim()){ alert('Kendini arayamazsın'); return; }
              try{ await getMic(); }catch{ return; }
              callStatusEl.textContent = fid + ' aranıyor...';
              const call = peer.call(fid, localStream);
              if(!call){ alert('Arama başlatılamadı, numara bağlı olmayabilir'); return; }
              handleCall(call);
          };

          function endCallUI(msg){
              callStatusEl.textContent = msg || 'Kapandı';
              currentCall = null;
              callBtn.disabled = false;
              hangBtn.disabled = true;
          }

          hangBtn.onclick = () => {
              if(currentCall) currentCall.close();
              endCallUI('Kapattın');
          };
          </script>
          </body>
          </html>
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FakeCall-APK
          path: app/build/outputs/apk/debug/app-debug.apk
