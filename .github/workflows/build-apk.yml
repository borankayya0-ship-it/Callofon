name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Manuel - HATA DUZELTILDI
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/cmdline-tools/
          # Lisanslari kabul et
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          # Gerekli paketleri yukle
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "platforms;android-33"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Create Full Android Project
        run: |
          set -e
          mkdir -p app/src/main/java/com/fakecall/voip
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'

          android {
              namespace 'com.fakecall.voip'
              compileSdk 34
              buildToolsVersion "34.0.0"
              defaultConfig {
                  applicationId "com.fakecall.voip"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
                  debug { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat > app/proguard-rules.pro <<'EOF'
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">FakeCall VoIP</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@android:mipmap/sym_def_app_icon"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/fakecall/voip/MainActivity.kt <<'EOF'
          package com.fakecall.voip

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.webkit.PermissionRequest
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  setContentView(webView)
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO), 1001)
                  }
                  webView.settings.javaScriptEnabled = true
                  webView.settings.mediaPlaybackRequiresUserGesture = false
                  webView.settings.domStorageEnabled = true
                  webView.settings.allowFileAccess = true
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onPermissionRequest(request: PermissionRequest) {
                          runOnUiThread { request.grant(request.resources) }
                      }
                  }
                  webView.loadUrl("file:///android_asset/index.html")
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="tr">
          <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>FakeCall VoIP</title>
          <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
          <style>
          *{box-sizing:border-box;font-family:sans-serif}body{margin:0;background:#0f1115;color:#fff;display:flex;flex-direction:column;min-height:100vh}
          .header{padding:20px;text-align:center;background:linear-gradient(135deg,#6a5af9,#8d4ef8)}
          .header h1{margin:0;font-size:24px}.header p{opacity:.9;margin:6px 0 0;font-size:13px}
          .container{padding:16px;flex:1;display:flex;flex-direction:column;gap:14px;max-width:480px;width:100%;margin:0 auto}
          .card{background:#1a1d26;border:1px solid #2a2e3a;border-radius:16px;padding:16px}
          .label{font-size:12px;color:#9aa0b2;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:block}
          input{width:100%;background:#0f1115;border:1px solid #2a2e3a;color:#fff;padding:14px;border-radius:12px;font-size:16px;outline:none}
          .btn{width:100%;padding:14px;border-radius:12px;border:0;font-weight:700;font-size:15px;cursor:pointer}
          .btn-primary{background:linear-gradient(135deg,#6a5af9,#8d4ef8);color:#fff}
          .btn-success{background:#1fdf75;color:#000}.btn-danger{background:#ff3b5c;color:#fff}
          .btn:disabled{opacity:.4}.status{font-size:13px;padding:10px 12px;border-radius:10px;background:#0f1115;border:1px dashed #2a2e3a;color:#9aa0b2;margin-top:12px}
          .status.online{color:#1fdf75;border-color:#1fdf75;background:rgba(31,223,117,.08)}.row{display:flex;gap:10px}.row .btn{flex:1}
          </style>
          </head>
          <body>
          <div class="header"><h1>FakeCall VoIP</h1><p>Internet uzerinden sahte numara ile gercek arama</p></div>
          <div class="container">
          <div class="card"><span class="label">Senin Sahte Numaran</span><input id="myNumber" placeholder="05550001122" /><div style="height:10px"></div><button id="connectBtn" class="btn btn-primary">Baglan ve Hazir Ol</button><div id="myStatus" class="status">Bagli degil</div></div>
          <div class="card"><span class="label">Arkadasinin Numarasi</span><input id="friendNumber" placeholder="05550003344" /><div style="height:12px"></div><div class="row"><button id="callBtn" class="btn btn-success" disabled>Ara</button><button id="hangBtn" class="btn btn-danger" disabled>Kapat</button></div><div id="callStatus" class="status">Arama yok</div></div>
          <audio id="remoteAudio" autoplay playsinline></audio>
          </div>
          <script>
          let peer=null,currentCall=null,localStream=null;
          const myNumberEl=document.getElementById('myNumber'),friendNumberEl=document.getElementById('friendNumber'),connectBtn=document.getElementById('connectBtn'),callBtn=document.getElementById('callBtn'),hangBtn=document.getElementById('hangBtn'),myStatusEl=document.getElementById('myStatus'),callStatusEl=document.getElementById('callStatus'),remoteAudio=document.getElementById('remoteAudio');
          async function getMic(){if(localStream)return localStream;localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});return localStream;}
          connectBtn.onclick=async()=>{
          const id=myNumberEl.value.trim().replace(/[^0-9]/g,'');if(id.length<7){alert('En az 7 haneli numara gir');return;}
          connectBtn.disabled=true;myStatusEl.textContent='Mikrofon aciliyor...';try{await getMic();}catch{connectBtn.disabled=false;return;}
          myStatusEl.textContent='Baglaniyor ID:'+id;
          peer=new Peer(id,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});
          peer.on('open',o=>{myStatusEl.textContent='✅ Baglisin! Numaran:'+o;myStatusEl.className='status online';callBtn.disabled=false;connectBtn.textContent='Bagli';});
          peer.on('call',async call=>{if(!confirm(call.peer+' seni ariyor. Acilsin mi?')){call.close();return;}await getMic();handleCall(call);call.answer(localStream);callStatusEl.textContent=call.peer+' ile konusuyorsun...';});
          peer.on('error',err=>{myStatusEl.textContent='Hata:'+err.type;if(err.type==='unavailable-id'){alert('Bu numara kullaniliyor, baska dene');connectBtn.disabled=false;}});
          };
          function handleCall(call){if(currentCall)currentCall.close();currentCall=call;callBtn.disabled=true;hangBtn.disabled=false;call.on('stream',s=>{remoteAudio.srcObject=s;remoteAudio.play().catch(()=>{});callStatusEl.textContent='🔊 Baglandi';});call.on('close',()=>endCallUI('Bitti'));call.on('error',e=>endCallUI('Hata:'+e.message));}
          callBtn.onclick=async()=>{const fid=friendNumberEl.value.trim().replace(/[^0-9]/g,'');if(!fid){alert('Numara gir');return;}await getMic();callStatusEl.textContent=fid+' araniyor...';const call=peer.call(fid,localStream);if(!call){alert('Numara bagli degil');return;}handleCall(call);};
          function endCallUI(m){callStatusEl.textContent=m;currentCall=null;callBtn.disabled=false;hangBtn.disabled=true;}
          hangBtn.onclick=()=>{if(currentCall)currentCall.close();endCallUI('Kapattin');};
          </script></body></html>
          EOF

      - name: Build Debug APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FakeCall-APK
          path: app/build/outputs/apk/debug/app-debug.apk
